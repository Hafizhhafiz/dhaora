[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --strict-markers
markers =
    gpu: Tests that require a functional CUDA GPU
    requires_model: Tests that require trained or pretrained model weights
    requires_data: Tests that require primary or secondary dataset images
    network: Tests that require external network access (APIs)
    slow: Tests that take more than 10 seconds to execute
